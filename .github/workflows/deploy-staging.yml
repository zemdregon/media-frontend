name: Deploy staging

# Deploys the staging environment (ROADMAP T0.7). It runs after CI passes on main, and can be
# triggered manually. It needs the repository secret CLOUDFLARE_API_TOKEN, scoped to the staging
# account with Workers Scripts:Edit, D1:Edit and Queues:Edit. Production deploys are a separate,
# manually approved workflow (TDD, CI/CD).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: f94d28e88a63fb6f34c3ecbc05aa3faf
  STAGING_URL: https://cinewren-staging.lmao.workers.dev

jobs:
  deploy:
    name: Migrate, deploy and smoke-test staging
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Apply D1 migrations (staging)
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler d1 migrations apply cinewren-staging --env staging --remote
      - name: Deploy Worker (staging)
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy --env staging
      - name: Smoke test
        run: |
          set -euo pipefail
          health=$(curl -fsS "$STAGING_URL/api/v1/health")
          echo "health: $health"
          echo "$health" | grep -q '"status":"ok"'
          curl -fsS -o /dev/null "$STAGING_URL/"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$STAGING_URL/api/v1/me")
          test "$code" = "401"
